name: hdns
description: "One-tap Private DNS switcher with a Quick Settings tile."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  dynamic_color: 1.8.1
  shared_preferences: ^2.5.5
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 28
  image_path: "assets/logo.webp"
  adaptive_icon_foreground: "assets/logo.webp"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: "assets/logo_monochrome.webp"
